name: Deploy

# On every push to main: run the CI gate, apply Supabase migrations, then ship to Vercel production.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: issztoztywufknsrjuam
  VERCEL_ORG_ID: team_Kj9AZoMQIoZelJEEBqfu40yy
  VERCEL_PROJECT_ID: prj_mcZt6AVAa9iKZoaF5Ld5yOo5phV0

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  migrate:
    name: Supabase migrations
    needs: check
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push --yes

  deploy:
    name: Vercel production
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
